<!doctype html>
<!--
  The site's steel textures, drawn as SVG and screenshotted by render.mjs.
  Adapted from music-plugins tools/cold-steel-texture/textures.html (the Cold
  Steel skin's generator): same passes and seeds, with a palette per skin.

    ?which=chassis|panel&palette=steel|matrix

    chassis  1800 x 1600: blasted steel behind the page (mottling, oil stains,
             rolled grain, fine grit, scratches). Shown cover-fitted.
    panel    512 x 512, tiles seamlessly: a module face, lighter and finer.
             Tiled at 2x (256 px) on story cards.
-->
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000}svg{display:block}</style>
</head><body>
<script>
const params = new URLSearchParams(location.search);
const which = params.get('which') === 'panel' ? 'panel' : 'chassis';
const PALETTES = {
  steel: {
    chassis: '#13171E', panel: '#2B323E',
    grain: '0.5 0.55 0.62', mottle: '0.05 0.07 0.1', stains: '0.01 0.015 0.02', brush: '0.8 0.85 0.92',
    scratchChassis: '#C8D2DE', scratchPanel: '#D9E2EC',
  },
  // Green-black: the same steel under a phosphor monitor.
  matrix: {
    chassis: '#080D09', panel: '#152018',
    grain: '0.36 0.6 0.42', mottle: '0.012 0.062 0.028', stains: '0.004 0.02 0.008', brush: '0.66 0.92 0.72',
    scratchChassis: '#A9DDB6', scratchPanel: '#C4EFCF',
  },
};
const palette = PALETTES[params.get('palette')] || PALETTES.steel;
const W = which === 'panel' ? 512 : 1800, H = which === 'panel' ? 512 : 1600;
const tile = which === 'panel';
const base = palette[which];

let seed = which === 'panel' ? 31 : 7;
function rnd() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }

const NS = 'http://www.w3.org/2000/svg';
const svg = document.createElementNS(NS, 'svg');
svg.setAttribute('width', W); svg.setAttribute('height', H);
svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
document.body.appendChild(svg);
function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  (parent || svg).appendChild(e);
  return e;
}
function rgbMatrix(rgb, alpha) {
  const [r, g, b] = rgb.split(' ');
  return `0 0 0 0 ${r}  0 0 0 0 ${g}  0 0 0 0 ${b}  0 0 0 ${alpha}`;
}

const stitch = tile ? ' stitchTiles="stitch"' : '';
const f = tile ? 1 : 0.5;
el('defs', {}).innerHTML = `
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="${0.9 * f * 2}" numOctaves="3" seed="4"${stitch}/>
    <feColorMatrix type="matrix" values="${rgbMatrix(palette.grain, '0.9 -0.25')}"/>
  </filter>
  <filter id="mottle" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="${0.012 * f} ${0.02 * f}" numOctaves="4" seed="11"${stitch}/>
    <feColorMatrix type="matrix" values="${rgbMatrix(palette.mottle, '1.4 -0.55')}"/>
  </filter>
  <filter id="stains" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="${0.035 * f}" numOctaves="3" seed="21"${stitch}/>
    <feColorMatrix type="matrix" values="${rgbMatrix(palette.stains, '-3.2 1.45')}"/>
  </filter>
  <filter id="brush" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="${0.002 * f} ${0.6 * f}" numOctaves="2" seed="3"${stitch}/>
    <feColorMatrix type="matrix" values="${rgbMatrix(palette.brush, '0.5 -0.18')}"/>
  </filter>`;

el('rect', { x: 0, y: 0, width: W, height: H, fill: base });
const passes = which === 'chassis'
  ? { mottle: 1, stains: 0.8, brush: 0.06, grain: 0.13 }
  : { mottle: 0.65, stains: 0.32, brush: 0.05, grain: 0.06 };
for (const [filter, opacity] of Object.entries(passes))
  el('rect', { x: 0, y: 0, width: W, height: H, filter: `url(#${filter})`, opacity });

// Scratches: hairlines, a few curved, some at a steeper angle. On the tile
// each one is drawn again one tile over wherever it crosses an edge.
const count = which === 'chassis' ? 260 : 70, alpha = which === 'chassis' ? 0.13 : 0.12;
const g = el('g', { stroke: which === 'chassis' ? palette.scratchChassis : palette.scratchPanel, 'stroke-linecap': 'round', fill: 'none' });
for (let i = 0; i < count; i++) {
  const sx = rnd() * W, sy = rnd() * H, len = (8 + rnd() * 60) * 2;
  const a = (rnd() - 0.5) * 0.9 + (rnd() < 0.5 ? 0 : Math.PI / 2.6);
  const ex = sx + Math.cos(a) * len, ey = sy + Math.sin(a) * len;
  const mx = (sx + ex) / 2 + (rnd() - 0.5) * 12, my = (sy + ey) / 2 + (rnd() - 0.5) * 12;
  const width = (0.4 + rnd() * 0.6) * 2, opacity = alpha * (0.4 + rnd());
  const offsets = tile ? [-1, 0, 1].flatMap(ox => [-1, 0, 1].map(oy => [ox * W, oy * H])) : [[0, 0]];
  for (const [ox, oy] of offsets)
    el('path', { d: `M${sx + ox} ${sy + oy}Q${mx + ox} ${my + oy} ${ex + ox} ${ey + oy}`, 'stroke-width': width, opacity }, g);
}
</script>
</body></html>
