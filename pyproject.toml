[project]
name = "daily-brief"
version = "0.1.0"
description = "Daily news brief: agreed facts, disputes, framing and omissions across outlets."
requires-python = ">=3.12"
dependencies = ["feedparser>=6.0.11"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["brief"]

[tool.pytest.ini_options]
testpaths = ["tests"]
