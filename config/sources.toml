# Outlets the brief reads.
#
# lean: an approximation from public media-bias charts (AllSides, Ad Fontes) for
#   the outlet's news coverage, not its opinion pages. One of left, lean_left,
#   center, lean_right, right. Edit freely.
# paywalled: true when most articles are behind a paywall. The writer then works
#   from the feed's headline and summary only and says so.
# feeds: section is where the feed's articles are filed before clustering
#   (us, world, business, nyc). kind is rss, or google_news for outlets with no
#   RSS of their own.
#
# A feed that fails or goes stale shows up in the ingest bundle's errors; fix or
# drop it here.

# --- US national -------------------------------------------------------------

[[source]]
id = "nyt"
name = "The New York Times"
lean = "lean_left"
paywalled = true
feeds = [
  { url = "https://rss.nytimes.com/services/xml/rss/nyt/US.xml", section = "us", kind = "rss" },
  { url = "https://rss.nytimes.com/services/xml/rss/nyt/Politics.xml", section = "us", kind = "rss" },
  { url = "https://rss.nytimes.com/services/xml/rss/nyt/World.xml", section = "world", kind = "rss" },
