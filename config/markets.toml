# Numbers for the Markets section.
#
# provider: fred (St. Louis Fed): free CSV with no key, and it answers GitHub
#   Actions (Yahoo Finance and Stooq don't). symbol is the FRED series id.
#   Stock indexes are a day behind; oil, gas and currencies up to a week.
#   World indexes other than the Nikkei, and gold, need a keyed source.
# unit: points, usd, percent (shown as basis-point changes) or fx_rate.
# transform: level, or yoy_percent (change from a year earlier; for monthly
#   index series like CPI).
# blurb: one plain-English line on what the number is and why anyone watches it.

# --- US stocks -----------------------------------------------------------------

[[instrument]]
symbol = "SP500"
name = "S&P 500"
group = "us_stocks"
unit = "points"
provider = "fred"
transform = "level"
blurb = "500 of the largest US companies. The standard scoreboard for the US stock market."

[[instrument]]
symbol = "NASDAQCOM"
name = "Nasdaq Composite"
group = "us_stocks"
unit = "points"
provider = "fred"
transform = "level"
blurb = "Heavy on tech companies, so it swings harder than the S&P 500 on tech news."

[[instrument]]
symbol = "DJIA"
name = "Dow Jones Industrial Average"
group = "us_stocks"
unit = "points"
provider = "fred"
transform = "level"
blurb = "30 big, established US companies. The oldest and most quoted index, but narrow."

# --- World stocks --------------------------------------------------------------

[[instrument]]
symbol = "NIKKEI225"
name = "Nikkei 225"
group = "world_stocks"
unit = "points"
provider = "fred"
transform = "level"
blurb = "Japan's main stock index."

[[instrument]]
symbol = "DFF"
name = "Fed funds rate"
group = "rates"
unit = "percent"
provider = "fred"
transform = "level"
blurb = "The overnight rate the Federal Reserve targets. Every other US interest rate keys off it."

[[instrument]]
symbol = "DGS2"
name = "2-year Treasury yield"
group = "rates"
unit = "percent"
provider = "fred"
transform = "level"
blurb = "What the US government pays to borrow for 2 years. Moves with expectations for Fed rate changes."

[[instrument]]
symbol = "DGS10"
name = "10-year Treasury yield"
group = "rates"
unit = "percent"
provider = "fred"
transform = "level"
blurb = "The government's 10-year borrowing cost. Mortgage rates and company borrowing costs follow it."

[[instrument]]
symbol = "MORTGAGE30US"
name = "30-year mortgage rate"
group = "rates"
unit = "percent"
provider = "fred"
transform = "level"
blurb = "Freddie Mac's weekly average for a 30-year fixed mortgage."

# --- Economy -------------------------------------------------------------------

[[instrument]]
symbol = "CPIAUCSL"
name = "Inflation (CPI, year over year)"
group = "economy"
unit = "percent"
provider = "fred"
transform = "yoy_percent"
blurb = "How much consumer prices rose over the past year. The Fed aims for about 2%."

[[instrument]]
symbol = "UNRATE"
name = "Unemployment rate"
group = "economy"
unit = "percent"
provider = "fred"
transform = "level"
blurb = "Share of people looking for work who can't find it. From the monthly jobs report."

