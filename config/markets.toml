# --- Rates ---------------------------------------------------------------------

[[instrument]]
symbol = "DFF"
name = "Fed funds rate"
group = "rates"
unit = "percent"
provider = "fred"
transform = "level"
blurb = "The overnight rate the Federal Reserve targets. Every other US interest rate keys off it."

[[instrument]]
symbol = "DGS2"
name = "2-year Treasury yield"
group = "rates"
unit = "percent"
provider = "fred"
transform = "level"
blurb = "What the US government pays to borrow for 2 years. Moves with expectations for Fed rate changes."

[[instrument]]
symbol = "DGS10"
name = "10-year Treasury yield"
group = "rates"
unit = "percent"
provider = "fred"
transform = "level"
blurb = "The government's 10-year borrowing cost. Mortgage rates and company borrowing costs follow it."

[[instrument]]
symbol = "MORTGAGE30US"
name = "30-year mortgage rate"
group = "rates"
unit = "percent"
provider = "fred"
transform = "level"
blurb = "Freddie Mac's weekly average for a 30-year fixed mortgage."

