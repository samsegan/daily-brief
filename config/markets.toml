# Numbers for the Markets section.
#
# provider: fred (St. Louis Fed: US indexes, rates, Bitcoin, economic series) or
#   stooq (world indexes, commodities, currencies). Both are free CSV with no
#   key; FRED is usually a day behind. symbol is the provider's own ticker.
# unit: points, usd, percent (shown as basis-point changes) or fx_rate.
# transform: level, or yoy_percent (change from a year earlier; for monthly
#   index series like CPI).
# blurb: one plain-English line on what the number is and why anyone watches it.

# --- US stocks -----------------------------------------------------------------

[[instrument]]
symbol = "SP500"
name = "S&P 500"
group = "us_stocks"
unit = "points"
provider = "fred"
transform = "level"
blurb = "500 of the largest US companies. The standard scoreboard for the US stock market."

[[instrument]]
symbol = "NASDAQCOM"
name = "Nasdaq Composite"
group = "us_stocks"
unit = "points"
provider = "fred"
transform = "level"
blurb = "Heavy on tech companies, so it swings harder than the S&P 500 on tech news."

[[instrument]]
symbol = "DJIA"
name = "Dow Jones Industrial Average"
group = "us_stocks"
unit = "points"
provider = "fred"
transform = "level"
blurb = "30 big, established US companies. The oldest and most quoted index, but narrow."

