# Numbers for the Markets section.
#
# provider: yahoo (Yahoo Finance chart data, for prices) or fred (St. Louis Fed,
#   for official rates and economic series; free, no key, usually a day behind).
# unit: points, usd, percent (shown as basis-point changes) or fx_rate.
# transform: level, or yoy_percent (change from a year earlier; for monthly
#   index series like CPI). Yahoo instruments only support level.
# blurb: one plain-English line on what the number is and why anyone watches it.

# --- US stocks -----------------------------------------------------------------

[[instrument]]
symbol = "^GSPC"
name = "S&P 500"
group = "us_stocks"
unit = "points"
provider = "yahoo"
transform = "level"
blurb = "500 of the largest US companies. The standard scoreboard for the US stock market."

[[instrument]]
symbol = "^IXIC"
name = "Nasdaq Composite"
group = "us_stocks"
unit = "points"
provider = "yahoo"
transform = "level"
blurb = "Heavy on tech companies, so it swings harder than the S&P 500 on tech news."

[[instrument]]
symbol = "^DJI"
name = "Dow Jones Industrial Average"
group = "us_stocks"
unit = "points"
provider = "yahoo"
transform = "level"
blurb = "30 big, established US companies. The oldest and most quoted index, but narrow."

[[instrument]]
symbol = "^RUT"
name = "Russell 2000"
group = "us_stocks"
unit = "points"
provider = "yahoo"
transform = "level"
blurb = "2,000 smaller US companies. More sensitive to interest rates and the domestic economy."

