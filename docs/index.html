<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="A personal daily news brief: what outlets agree on, where they differ, and what they left out.">
  <title>Daily Brief</title>
  <script src="skin.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700&family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,600;6..72,700&family=Share+Tech+Mono&display=swap">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="steel.css">
</head>
<body>
  <header class="masthead">
    <canvas class="rain" id="rain" aria-hidden="true"></canvas>
    <div class="wrap masthead-row">
      <div>
        <h1 class="brand">
          <span class="wordmark">Daily Brief</span>
          <span class="byline">by
            <img class="signature on-dark" src="assets/Signature.png" alt="Segan" width="311" height="88">
            <img class="signature on-light" src="assets/SignatureDark.png" alt="Segan" width="311" height="88">
          </span>
        </h1>
        <p class="dateline" id="dateline"></p>
      </div>
      <div class="controls">
        <label class="edition">
          <span>Edition</span>
          <select id="edition" aria-label="Choose an edition"></select>
        </label>
        <details class="settings" id="settings">
          <summary aria-label="Display settings" title="Display settings">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="3.4"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></g></svg>
          </summary>
          <form class="settings-panel" id="settings-panel"></form>
        </details>
      </div>
    </div>
    <nav class="section-nav" aria-label="Sections">
      <div class="wrap" id="section-nav"></div>
    </nav>
  </header>
  <main class="wrap" id="app">
    <p class="status">Loading the brief…</p>
  </main>
  <footer class="wrap footer" id="footer"></footer>
  <script type="module" src="app.js"></script>
</body>
</html>
